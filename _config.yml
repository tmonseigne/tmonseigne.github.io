# Site settings
title: Thibaut Monseigne
email: monseignethibaut@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  Site de Thibaut Monseigne.
permalink: ':title/'
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://tmonseigne.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Author settings
author: Thibaut Monseigne
author-pic: Ange.jpg

# Contact links
website: tmonseigne.github.io
orcid: 0000-0003-3516-8631
linkedin: thibaut-monseigne
github: tmonseigne # Add your Github handle

# Paginate
paginate: 8
paginate_path: /page:num/

# Build settings
markdown: kramdown

plugins:
  - jekyll-paginate
  - jekyll-sitemap

include: [_pages]
# Les sources de travail restent dans le dépôt mais ne sont pas publiées.
exclude:
  - node_modules
  - gulpfile.js
  - package.json
  - yarn.lock
  - README.md
  - LICENSE
  - proto
  - "**/*.psd"
