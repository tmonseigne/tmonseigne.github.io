---
layout: default
---
<div class="flex-container">
  {% include header.html %}
  <article class="article-page">
    <div class="page-image">
      <div class="cover-image" style="background: url({{"/assets/img/" | prepend: site.baseurl | append : page.img}}) center no-repeat; background-size: cover;"></div>
    </div>
    <div class="wrapper post-layout">
      <div class="page-content">
        <div class="header-page">
          <h1 class="page-title">{{page.title}}</h1>
          <div class="page-date"><time datetime="{{ page.date | date_to_xmlschema }}">{% include date-fr.html date=page.date %}</time></div>
        </div>
        <div class="post-content">
          {{page.content | markdownify}}
        </div>
        <div class="page-footer">
          <div class="page-tag">
            <span>Étiquettes :</span>
            {% for tag in page.tags %}
            <a href="{{site.baseurl}}/tags/#{{tag | cgi_escape}}" class="tag">| {{ tag }}</a>
            {% endfor %}
          </div><!-- End Tags -->
        </div>
        {% include recent-post.html %}
      </div>
    </div> <!-- End Wrapper -->
  </article>
  <script src="{{site.baseurl}}/assets/js/toc.js" defer></script>
  {% include search.html %}
  {% include footer.html %}
</div>
