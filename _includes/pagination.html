<div class="pagination clearfix">
  {% if paginator.previous_page %}
    <a href="{{ paginator.previous_page_path }}" class="previous"><i class="fa fa-solid fa-angle-left" aria-hidden="true"></i> Précédent</a>
  {% endif %}
  {% if paginator.next_page %}
    <a href="{{ paginator.next_page_path }}" class="next">Suivant <i class="fa fa-solid fa-angle-right" aria-hidden="true"></i></a>
  {% endif %}
</div>
