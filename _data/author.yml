title: Ingénieur développeur informatique senior en microscopie SMLM
biography: >-
  Ingénieur développeur informatique senior, je suis spécialisé dans le développement logiciel et le traitement numérique de signaux, notamment biologiques. Mon expérience couvre notamment les signaux électrophysiologiques et la microscopie de super-résolution. Je travaille principalement en Python et en C++, avec une attention particulière à la conception et à l’architecture logicielles, aux performances et à la fiabilité des outils développés. J’aime traduire des méthodes scientifiques en logiciels clairs, maintenables et accessibles à leurs utilisateurs. Mon parcours professionnel, mes engagements associatifs et mes projets personnels s’inscrivent dans les domaines de la santé, de l’accessibilité et du bien-être, auxquels je souhaite continuer à contribuer.
